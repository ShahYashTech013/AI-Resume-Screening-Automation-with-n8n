name: Run AI Resume Screener
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour automatically
  workflow_dispatch: # Adds a button to run it manually

jobs:
  run-n8n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run n8n Workflow
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/data \
            -e N8N_ENCRYPTION_KEY=${{ secrets.N8N_KEY }} \
            n8nio/n8n n8n execute --import /data/workflow.json
